<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#15171d" />
  <title>IT クエスト | ITパスポート学習</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .music{position:fixed;z-index:4;right:max(18px,calc((100vw - 540px)/2 + 18px));bottom:82px;width:38px;height:38px;border-radius:50%;background:#292d37;border:1px solid #4a505e;color:#b8bdc7;font-size:19px}.music.playing{color:#ffab35;border-color:#ffab35;box-shadow:0 0 15px #ffab3540}.term-help{margin-top:14px;background:#1c2029;border:1px solid #353a46;border-radius:8px;padding:13px;text-align:left}.term-help>b{font-size:13px}.term-help>p{margin:3px 0 8px;font-size:11px;color:#a4a8b2}.term-help details{border-top:1px solid #353a46}.term-help summary{list-style:none;padding:11px 2px;font-size:12px;font-weight:700;cursor:pointer}.term-help summary::-webkit-details-marker{display:none}.term-help summary i{float:right;color:#ff4b2b;font-style:normal;font-size:17px;line-height:12px}.term-help details[open] summary i{transform:rotate(45deg)}.term-help details div{padding:0 2px 12px;color:#c7cbd2;font-size:12px;line-height:1.7}.feedback .primary{margin-top:22px}
    .lesson-page{min-height:100vh;max-width:540px;margin:auto;background:#101217;padding:16px 20px 178px}.lesson-page main{padding-top:30px}.lesson-label{display:inline-block;background:#ff4b2b22;color:#ff735b;padding:5px 9px;border-radius:4px;font-size:11px;font-weight:800}.lesson-page h1{font-size:30px;line-height:1.4;margin:15px 0 8px}.lesson-lead{color:#d5d7db;line-height:1.75;font-size:15px}.lesson-card{margin-top:14px;padding:16px;background:#1b1e26;border:1px solid #343844;border-radius:8px}.lesson-card h2{font-size:13px;margin:0 0 8px;color:#ffab35}.lesson-card p{margin:0;color:#d4d7dd;font-size:13px;line-height:1.8}.term-chips{display:grid;gap:7px}.term-chips details{background:#292d38;border-radius:5px}.term-chips summary{padding:10px;list-style:none;font-weight:700;font-size:13px;cursor:pointer}.term-chips summary::-webkit-details-marker{display:none}.term-chips summary i{float:right;color:#ff4b2b;font-style:normal}.term-chips details[open] summary i{transform:rotate(45deg)}.term-chips details p{padding:0 10px 10px;font-size:12px}.lesson-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:10px 20px calc(78px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#101217 24%)}.lesson-footer .primary{margin-top:8px}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
