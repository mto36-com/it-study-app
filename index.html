    .profile-page{min-height:100vh;max-width:540px;margin:auto;padding:54px 24px;background:radial-gradient(circle at 90% 0,#4b2020,#101217 45%)}.profile-logo{font-weight:900;font-size:20px;letter-spacing:1px}.profile-logo i{display:inline-block;width:10px;height:20px;background:#ff4b2b;vertical-align:-4px;transform:skew(-18deg);margin-right:7px}.profile-page h1{font-size:29px;margin:45px 0 4px}.profile-page>p{color:#afb3bd;font-size:13px;line-height:1.7}.profile-list{display:grid;gap:10px;margin:25px 0 15px}.profile-card{display:grid;grid-template-columns:52px 1fr;text-align:left;column-gap:13px;align-items:center;padding:14px;background:#1b1e26;border:1px solid #343844;border-radius:9px}.profile-card span{grid-row:span 2;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff7646,#b52928);font-size:21px;font-weight:900}.profile-card b{font-size:16px}.profile-card small{color:#a4a8b2;font-size:11px}.new-profile{width:100%;padding:14px;background:transparent;border:1px dashed #626875;border-radius:8px;color:#d5d7dc;font-weight:700}.profile-form,.pin-form{margin-top:22px;padding:17px;background:#1b1e26;border:1px solid #343844;border-radius:9px}.profile-form h2,.pin-form h2{font-size:17px;margin:0 0 13px}.profile-form label{display:block;color:#cdd0d6;font-size:12px;margin:12px 0}.profile-form input,.pin-form input{display:block;width:100%;margin-top:6px;padding:13px;background:#101217;border:1px solid #4b5160;border-radius:6px;color:#fff;font:inherit}.pin-form p{color:#a4a8b2;font-size:12px}.form-error{color:#ff8069!important;min-height:18px}.profile-note{margin-top:28px!important;color:#777d89!important;font-size:11px!important}.hidden{display:none!important}.profile-switch{position:fixed;z-index:4;right:max(18px,calc((100vw - 540px)/2 + 18px));top:20px;width:38px;height:38px;border-radius:50%;background:#292d37;border:1px solid #4a505e;color:#fff;font-weight:900}
